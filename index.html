<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeria de Cachorros</title>
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff0f4;
    color: #444;
    min-height: 100vh;
    padding: 40px 20px;
}

h1 {
    text-align: center;
    color: #c65378;
    font-size: 38px;
    margin-bottom: 12px;
}

body > label,
body > button {
    display: inline-block;
}

body {
    text-align: center;
}

select,
input {
    padding: 13px;
    border: 1px solid #f0b6c8;
    border-radius: 10px;
    background: white;
    color: #555;
    font-size: 15px;
    margin: 20px 5px 10px;
    outline: none;
}

select:focus,
input:focus {
    border-color: #d85d87;
}

button {
    padding: 13px 20px;
    border: none;
    border-radius: 10px;
    background: #d85d87;
    color: white;
    font-size: 15px;
    cursor: pointer;
    margin: 10px 5px;
    transition: 0.3s;
}

button:hover {
    background: #b9436b;
    transform: translateY(-3px);
}

#mensagem {
    color: #c65378;
    font-weight: bold;
    margin: 20px;
    font-size: 16px;
}

#galeria {
    max-width: 1100px;
    margin: 30px auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
}

#galeria img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 18px;
    border: 5px solid white;
    box-shadow: 0 5px 15px rgba(180, 80, 120, 0.15);
    transition: 0.3s;
}

#galeria img:hover {
    transform: scale(1.04);
}

@media (max-width: 600px) {
    body {
        padding: 25px 12px;
    }

    h1 {
        font-size: 28px;
    }

    select,
    input,
    button {
        width: 90%;
        margin: 8px auto;
    }

    #galeria {
        grid-template-columns: 1fr;
    }
}

    </style>
  </head>
  <body>
    <h1>Galeria de Cachorros</h1>

    <label for="racas">
      <select id="racas">
        <option value="">Selecione uma raça</option>
      </select>
    </label>

    <label for="quantidade">
      <input type="number" id="quantidade" min="1" max="10" value="3" />
    </label>

    <button id="aleatorios">Mostrar aleatórios</button>
    <button id="porRaca">Mostrar 3 da raça</button>

    <p id="mensagem"></p>

    <div id="galeria"></div>

    <script src="script.js"></script>
  </body>
</html>
